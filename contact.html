    <main class="content-page">
        <h1>Get in Touch</h1>
        <p>If you'd like to share a message, a memory, or just send some love, this is the place. (Note: This is a placeholder and the form is not functional).</p>
        <form class="contact-form-placeholder">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address">
            </div>
            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="6" placeholder="Write your heartfelt message here..."></textarea>
            </div>
            <button type="button" class="submit-button-placeholder">Send Message (Placeholder)</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 - A heartfelt dedication</p>
    </footer>

    <script src="js/main.js"></script>
</body>
